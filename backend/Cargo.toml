[package]
name = "swd-sink-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
pipewire = { version = "0.10.1", features = ["v1_0_0", "v1_2_0"] }
cpal = "0.17.3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
